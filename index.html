<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#0f3d2e" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
    <title>MK Supply Group</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Hidden copy of the contact form so Netlify can detect it at deploy time. Keep field names in sync with src/services/contact.js -->
    <form name="contact" data-netlify="true" netlify-honeypot="bot-field" hidden>
      <input type="text" name="bot-field" />
      <input type="text" name="company" />
      <input type="text" name="kvk" />
      <input type="email" name="email" />
      <input type="tel" name="phone" />
      <input type="text" name="buyerType" />
      <textarea name="message"></textarea>
      <input type="text" name="consent" />
      <input type="text" name="language" />
    </form>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
